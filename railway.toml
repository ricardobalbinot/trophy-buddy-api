[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = ["/app/.venv/bin/alembic upgrade head"]
startCommand = "sh -c 'exec /app/.venv/bin/uvicorn trophy_buddy_api.app:create_app --factory --host 0.0.0.0 --port ${PORT:-8000} --no-access-log'"
healthcheckPath = "/readyz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
