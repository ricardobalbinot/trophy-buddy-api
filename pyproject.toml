[project]
name = "trophy-buddy-api"
version = "0.2.0"
description = "PostgreSQL-backed Trophy Buddy API with PSN imports, trophies and IGDB metadata."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=44",
  "fastapi>=0.115,<1",
  "firebase-admin>=6.9,<8",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trophy_buddy_api"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv.previous"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
no-sections = true

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["firebase_admin.*", "google.*"]
ignore_missing_imports = true
